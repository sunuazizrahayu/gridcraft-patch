# Plain debug/release binaries for every push to main and every PR, so a change can be
# downloaded and tried without waiting for the signed release pipeline (which only runs
# on the `release` branch). The `CI` workflow stays the quality gate (`cargo xtask ci`);
# this one just builds `gridcraft` + `gridcraft-cli` on Linux, Windows and macOS and
# uploads them as artifacts.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build dependencies (winit, wgpu, rfd)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers

      - name: Install Rust (stable, minimal)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build gridcraft and gridcraft-cli
        run: cargo build --locked --release -p gridcraft -p gridcraft-cli

      - name: Smoke-test the CLI
        shell: bash
        run: |
          CLI="target/release/gridcraft-cli"
          [ -f "$CLI.exe" ] && CLI="$CLI.exe"
          "$CLI" --version
          "$CLI" eval '=SUM(1,2,3)'

      - name: Stage binaries
        shell: bash
        run: |
          mkdir -p dist/build
          for b in gridcraft gridcraft-cli; do
            if [ -f "target/release/$b.exe" ]; then
              cp "target/release/$b.exe" dist/build/
            else
              cp "target/release/$b" dist/build/
            fi
          done
          ls -la dist/build

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: gridcraft-${{ matrix.os }}
          path: dist/build/
          if-no-files-found: error
          retention-days: 7
