# AppImage for every push to main and every PR, so a change can be downloaded and tried
# on any Linux distro without waiting for the signed release pipeline (which only runs on
# the `release` branch). The `CI` workflow stays the quality gate (`cargo xtask ci`); this
# one just runs `packaging/linux/package.sh --formats "appimage"` and uploads the result.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    name: AppImage (x86_64)
    # Ubuntu 22.04 (glibc 2.35): the AppImage then runs on 22.04 and newer distros.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build dependencies (winit, wgpu, rfd, zsync)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers zsync

      - name: Install Rust (stable, minimal)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the AppImage
        run: packaging/linux/package.sh --formats "appimage"

      - name: Upload the AppImage
        uses: actions/upload-artifact@v4
        with:
          name: gridcraft-linux-x86_64-appimage
          path: dist/release/*.AppImage*
          if-no-files-found: error
          retention-days: 7
